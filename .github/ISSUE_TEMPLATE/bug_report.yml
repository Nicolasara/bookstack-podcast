name: Bug report
description: Report a bug in BookStack Podcast
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to file a bug report.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to '...'
        2. Click '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: BookStack Podcast version (or git commit if running master)
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: |
        - OS:
        - Docker version:
        - BookStack version:
        - TTS engine: edge / openai
        - LLM provider: openai / gemini
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Output from `docker logs bookstack-podcast`
      render: shell
