name: DCO
on:
  pull_request:
    branches: [master]

jobs:
  dco-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check DCO sign-offs
        uses: tim-actions/dco@master
        with:
          commits: ${{ github.event.pull_request.commits }}
